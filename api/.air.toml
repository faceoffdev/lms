root = "."
tmp_dir = "temp"

[build]
bin = "./temp/main"
cmd = "go build -buildvcs=false -gcflags \"all=-N -l\" -o ./temp/main ./cmd/server"
delay = 1000
exclude_dir = ["temp"]
exclude_file = []
exclude_regex = []
exclude_unchanged = false
follow_symlink = false
full_bin = "dlv exec ./temp/main --continue --accept-multiclient --listen=:2345 --headless=true --api-version=2 --log"
include_dir = []
include_ext = ["go", "mod", "env"]
kill_delay = "10s"
log = "build-errors.log"
send_interrupt = true
stop_on_error = true

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
time = false

[misc]
clean_on_exit = false
